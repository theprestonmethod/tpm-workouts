<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TPM Workout Programs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--navy:#1B3A5C;--red:#a0443e;--cream:#F4F1ED;--off:#F8F6F3;--border:#D4CFC8;--text:#1C1C1C;--gray:#808080;--green:#3d6b52;--orange:#c97a1a;--cyan:#17a8b2;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
header{background:var(--navy);padding:28px 24px;text-align:center;}
.logo{width:48px;height:48px;background:white;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 4px 16px rgba(0,0,0,0.2);}
.logo span{font-family:'Bebas Neue';font-size:18px;color:var(--navy);}
h1{font-family:'Bebas Neue';font-size:26px;letter-spacing:3px;color:white;margin-bottom:4px;}
.sub{font-size:12px;color:rgba(255,255,255,0.75);}
.back{display:inline-block;margin-top:12px;font-size:12px;color:rgba(255,255,255,0.8);text-decoration:none;}
.back:hover{color:white;}

main{flex:1;padding:24px 20px;max-width:480px;margin:0 auto;width:100%;}

.search-box{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans';font-size:14px;background:white;color:var(--text);margin-bottom:20px;}
.search-box:focus{outline:none;border-color:var(--navy);}

.section-label{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--gray);text-transform:uppercase;margin-bottom:10px;margin-top:20px;}
.section-label:first-of-type{margin-top:0;}

.workout-card{display:flex;align-items:center;gap:14px;background:white;border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--text);transition:all 0.15s;box-shadow:0 2px 6px rgba(0,0,0,0.04);}
.workout-card:hover{border-color:var(--navy);transform:translateY(-1px);box-shadow:0 4px 12px rgba(27,58,92,0.1);}
.workout-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.workout-info{flex:1;}
.workout-name{font-size:14px;font-weight:700;margin-bottom:2px;}
.workout-meta{font-size:11px;color:var(--gray);}
.workout-arrow{font-size:16px;color:var(--border);}

.empty{text-align:center;padding:40px 20px;color:var(--gray);font-size:14px;}

footer{padding:20px;text-align:center;font-size:11px;color:var(--gray);line-height:1.8;}
</style>
</head>
<body>

<header>
 <div class="logo"><img src="../01_TPM_master_icon.png" style="width:44px;height:44px;border-radius:8px;object-fit:cover;"></div>
  <h1>WORKOUT PROGRAMS</h1>
  <div class="sub">THE PRESTON METHOD™ &middot; Oasis Training &amp; Education</div>
  <a href="https://theprestonmethod.github.io/tpm-workouts/" class="back">← Back to Tools</a>
</header>

<main>
  <input type="text" class="search-box" placeholder="🔍 Search by client name..." oninput="filterWorkouts(this.value)">

  <div id="workoutList"></div>
</main>

<footer>
  THE PRESTON METHOD™ &middot; 604.993.1888 &middot; www.theprestonmethod.com
</footer>

<script>
// ─────────────────────────────────────────────
// ADD NEW WORKOUTS HERE
// Copy a line and update: filename, client name, date, pillar color
// Colors: Mobility=#3d6b52  Strength=#c97a1a  Performance=#17a8b2  Mixed=#a0443e
// ─────────────────────────────────────────────
const WORKOUTS = [
  { file: 'TPM-Workout-Client-2026-04-04.html',        client: 'Client',      date: '2026-04-04', color: '#3d6b52' },
  { file: 'TPM-Workout-Me-and-you-2026-04-04.html',    client: 'Me and You',  date: '2026-04-04', color: '#c97a1a' },
  { file: 'TPM-Workout-last-chance-2026-04-04.html',   client: 'Last Chance', date: '2026-04-04', color: '#17a8b2' },
];
// ─────────────────────────────────────────────

function filterWorkouts(query) {
  renderWorkouts(query.toLowerCase());
}

function renderWorkouts(filter) {
  const list = document.getElementById('workoutList');
  const filtered = WORKOUTS.filter(w =>
    !filter || w.client.toLowerCase().includes(filter) || w.date.includes(filter)
  );

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">No workouts found</div>';
    return;
  }

  // Group by date
  const byDate = {};
  filtered.forEach(w => {
    if (!byDate[w.date]) byDate[w.date] = [];
    byDate[w.date].push(w);
  });

  let html = '';
  Object.keys(byDate).sort().reverse().forEach(date => {
    const label = new Date(date + 'T12:00:00').toLocaleDateString('en-CA', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    html += `<div class="section-label">${label}</div>`;
    byDate[date].forEach(w => {
      html += `
        <a href="${w.file}" class="workout-card">
          <div class="workout-dot" style="background:${w.color}"></div>
          <div class="workout-info">
            <div class="workout-name">${w.client}</div>
            <div class="workout-meta">${w.date} &middot; <span style="color:${w.color};font-weight:600;">TPM Program</span></div>
          </div>
          <div class="workout-arrow">›</div>
        </a>`;
    });
  });

  list.innerHTML = html;
}

renderWorkouts('');
</script>
</body>
</html>
